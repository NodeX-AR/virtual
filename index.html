<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f11">
<title>Cam Pro</title>
<style>
:root{
  --bg:#0e0f11;--surface:#17191c;--surface2:#23262b;--line:#2c3036;--ink:#f1f1ee;--dim:#8b8f96;
  --white:#f5f5f2;--rec:#ff453a;--ice:#58aeff;
  --out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);--inout:cubic-bezier(.65,0,.35,1);
  --glass:linear-gradient(135deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.10) 28%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.16) 100%),rgba(255,255,255,.04);
  --rim:rgba(255,255,255,.38);
  --lift:0 8px 24px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(255,255,255,.10) inset
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0;
  transition:transform .14s var(--inout),background-color .25s var(--out),color .25s var(--out),opacity .25s var(--out)}
button:active{transform:scale(.93)}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
video#pv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0;transform-origin:center}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none;transform-origin:center}
canvas#guides{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s var(--out)}
canvas#guides.on{opacity:1}
#ui{position:fixed;inset:0;pointer-events:none;z-index:3}
#ui .hit{pointer-events:auto}

#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5}
#top .grp{display:flex;gap:8px;flex-wrap:nowrap}
.tbtn{height:40px;min-width:40px;padding:0 11px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  -webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);
  text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.tbtn.act{background:linear-gradient(180deg,#fff,#f1efe9 50%,#d8d5cc 100%);color:#16181b;border-color:#fff;text-shadow:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35),0 1px 0 #fff inset,0 0 20px rgba(255,255,255,.28)}
.tbtn.act svg{filter:none}
.tbtn .lbl{font-size:11px;font-weight:600}

#hist{position:absolute;left:12px;top:calc(60px + env(safe-area-inset-top));width:96px;height:42px;
  border-radius:18px;background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  -webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);display:none;z-index:5}
#hist.on{display:block}

#hint{position:absolute;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-10px);
  background:var(--glass);border:1px solid var(--rim);padding:9px 16px;border-radius:999px;
  font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s var(--out),transform .5s var(--spring);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:6;max-width:88%}
#hint.on{opacity:1;transform:translate(-50%,0)}

#timer{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);
  background:linear-gradient(180deg,#ff7b70,#e0372d);padding:4px 12px;border-radius:999px;
  font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;opacity:0;
  border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 16px rgba(224,55,45,.45),0 1px 0 rgba(255,255,255,.45) inset;
  transition:opacity .3s var(--out),transform .5s var(--spring);z-index:6}
#timer.on{opacity:1;transform:translate(-50%,0)}

#focusRing{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border:2px solid #fff;border-radius:18px;
  opacity:0;pointer-events:none;box-shadow:0 0 16px rgba(255,255,255,.5),0 0 0 1px rgba(0,0,0,.25) inset;z-index:3}
#focusRing.show{animation:focus .9s both}
@keyframes focus{
  0%{opacity:0;transform:scale(1.5);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}

#faceBox{position:absolute;border:2px solid #fff;border-radius:18px;pointer-events:none;
  opacity:0;transition:opacity .25s var(--out),left .1s linear,top .1s linear,width .1s linear,height .1s linear;
  box-shadow:0 0 16px rgba(255,255,255,.4);z-index:3;display:none}
#faceBox.on{opacity:1;display:block}
#faceBox.lock{border-color:var(--ice);box-shadow:0 0 18px rgba(88,174,255,.6)}

#level{position:absolute;left:50%;top:50%;width:240px;height:2px;
  transform:translate(-50%,-50%) rotate(0deg);
  background:rgba(255,255,255,.6);opacity:0;transition:opacity .2s,background .2s,box-shadow .2s;
  pointer-events:none;z-index:3;border-radius:1px;margin-left:-120px;margin-top:-1px}
#level.on{opacity:1}
#level::before,#level::after{content:"";position:absolute;top:-5px;width:2px;height:12px;
  background:inherit;border-radius:1px}
#level::before{left:0}
#level::after{right:0}
#level.ok{background:#3ddc84;box-shadow:0 0 12px rgba(61,220,132,.7)}

#count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:600;
  pointer-events:none;opacity:0;text-shadow:0 2px 14px #0009;z-index:7}
#count.pop{animation:cpop 1s both}
@keyframes cpop{
  0%{opacity:0;transform:scale(1.6);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}

#shot{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#shot.go{animation:flash .35s var(--out)}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

#dock{position:absolute;left:0;right:0;bottom:calc(168px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;z-index:5}
#dock::-webkit-scrollbar{display:none}
#dock .chip{flex:none;height:44px;padding:0 16px;border-radius:999px;
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  -webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);
  text-shadow:0 1px 3px rgba(0,0,0,.55);color:#fff}
#dock .chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#dock .chip.act{background:linear-gradient(180deg,#fff,#f1efe9 50%,#d8d5cc 100%);color:#16181b;border-color:#fff;text-shadow:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35),0 1px 0 #fff inset,0 0 20px rgba(255,255,255,.28)}
#dock .chip.act svg{filter:none}

#modes{position:absolute;left:50%;bottom:calc(116px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:0;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--rim);
  box-shadow:var(--lift);-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);z-index:5}
#modes::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:82px;border-radius:999px;
  background:linear-gradient(180deg,#fff,#e9e7e0 55%,#d6d3ca);
  box-shadow:0 4px 12px rgba(0,0,0,.3),0 1px 0 #fff inset;
  transform:translateX(calc(var(--i,0) * 82px));transition:transform .55s var(--spring)}
#modes button{position:relative;width:82px;padding:8px 0;background:none;border:0;border-radius:999px;
  color:rgba(255,255,255,.85);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,.55);transition:color .3s var(--out)}
#modes button.sel{color:#16181b;text-shadow:none}

#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 28px calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;z-index:5}
#thumb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background-size:cover;background-position:center;overflow:hidden}
#thumb svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
#thumb.on{border:2px solid rgba(255,255,255,.85)}
#thumb.on svg{display:none}

#shutter{position:relative;width:88px;height:88px;border:0;background:none;border-radius:50%;display:grid;place-items:center}
#shutter::before{content:"";position:absolute;inset:0;border-radius:50%;--c:#fff;--pp:0;
  background:conic-gradient(var(--c) calc(var(--pp) * 1%),rgba(255,255,255,.55) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transition:--pp .5s linear}
#shutter.rec::before{--c:var(--rec)}
#shutter .core{width:70px;height:70px;border-radius:50%;
  background:radial-gradient(120% 120% at 32% 18%,#fff 0%,#f3f2ed 42%,#cdcbc2 100%);
  box-shadow:0 4px 12px rgba(0,0,0,.4),0 1px 0 #fff inset,0 -3px 6px rgba(0,0,0,.12) inset;
  transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring),background .4s var(--out),transform .2s var(--inout)}
#shutter:active .core{transform:scale(.9)}
#ui.vid #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#ff9d93 0%,#ff453a 45%,#b91d15 100%);
  box-shadow:0 4px 14px rgba(255,69,58,.5),0 1px 0 rgba(255,255,255,.55) inset,0 -3px 6px rgba(0,0,0,.2) inset}
#ui.ultra #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#9fd2ff,#58aeff 45%,#2f86e6)}
#ui.night #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#d1a0ff,#8a5cf5 45%,#5a2fc9)}
#shutter.rec .core{width:34px;height:34px;border-radius:11px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
#shutter .rip{position:absolute;inset:8px;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none}
#shutter.snap .rip{animation:ripple .6s cubic-bezier(.2,.8,.2,1)}
@keyframes ripple{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.55)}}
#bFlip{width:54px;height:54px;border-radius:50%;background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  display:grid;place-items:center}
#bFlip svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}

#rail{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  transition:transform .14s var(--inout),background .3s var(--out),color .3s var(--out)}
.zoom.on{background:linear-gradient(180deg,#fff,#ecebe4);color:#111;text-shadow:none;border-color:#fff}

.panel{position:absolute;left:12px;right:12px;bottom:calc(228px + env(safe-area-inset-bottom));
  background:var(--glass),rgba(8,10,14,.16);border:1px solid var(--rim);border-radius:32px;padding:18px;
  max-height:44vh;overflow:auto;opacity:0;visibility:hidden;transform:translateY(18px) scale(.97);
  pointer-events:none;transition:opacity .3s var(--out),transform .5s var(--spring),visibility 0s .3s;
  -webkit-backdrop-filter:blur(16px) saturate(1.7) brightness(1.05);backdrop-filter:blur(16px) saturate(1.7) brightness(1.05);
  box-shadow:var(--lift);z-index:6}
.panel.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .3s var(--out),transform .5s var(--spring),visibility 0s}
.grab{display:block;position:relative;height:26px;margin:-2px 0 4px;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(255,255,255,.6)}

.row{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;margin:8px 0}
.row label{color:rgba(255,255,255,.72);font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.row output{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.row select{grid-column:2/4;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
.row select option{background:#23262b;color:#fff}

.presets{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.presets button,.panel .btn{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.presets button.sel,.presets .btn.sel{background:linear-gradient(180deg,#fff,#f1efe9 50%,#d8d5cc 100%);color:#16181b;border-color:#fff;text-shadow:none}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#fff,#d6d4cc);box-shadow:0 3px 8px rgba(0,0,0,.45),0 1px 0 #fff inset;
  transition:transform .25s var(--spring)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#d6d4cc)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}

.meter{display:flex;gap:2px;height:20px;align-items:flex-end;margin-top:6px}
.meter i{flex:1;background:linear-gradient(to top,#3ddc84,#ffd60a 70%,#ff453a);height:2px;border-radius:2px;transition:height .05s linear;opacity:.85}

.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;
  border-radius:26px;text-align:left;color:#fff;background:var(--glass);border:1px solid var(--rim);
  box-shadow:var(--lift);text-shadow:0 1px 3px rgba(0,0,0,.5);
  transition:transform .14s var(--inout),background .4s var(--out),color .3s var(--out)}
.feat svg{width:28px;height:28px;margin-bottom:6px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.feat b{font-size:14px;font-weight:600}
.feat small{font-size:12px;opacity:.75;line-height:1.3}
.feat.on{background:linear-gradient(180deg,#fff,#ecebe4 55%,#d6d3ca);color:#16181b;border-color:#fff;
  text-shadow:none;box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 #fff inset,0 0 22px rgba(255,255,255,.3)}
.feat.on small{opacity:.7}
.feat.on svg{filter:none}
.feat:disabled{opacity:.4;cursor:not-allowed}

#viewer{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  background:rgba(6,7,9,.7);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  opacity:0;visibility:hidden;transition:opacity .3s var(--out),visibility 0s .3s}
#viewer.on{opacity:1;visibility:visible;transition:opacity .3s var(--out),visibility 0s}
#viewer .vwrap{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#viewer .vwrap img,#viewer .vwrap video{max-width:100%;max-height:100%;border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.25)}
#viewer .vbar{display:flex;gap:10px}
#viewer .btn{padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--glass);border:1px solid var(--rim);box-shadow:var(--lift);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:0 1px 3px rgba(0,0,0,.5)}

#err{position:absolute;top:calc(60px + env(safe-area-inset-top));left:12px;right:12px;
  background:var(--glass),rgba(8,10,14,.3);border:1px solid rgba(255,69,58,.7);border-radius:24px;
  padding:12px;display:none;z-index:9;max-height:40vh;overflow:auto;box-shadow:var(--lift);
  pointer-events:auto;user-select:text;-webkit-user-select:text}
#err.on{display:block}
#err pre{margin:0;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}

.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.pchips::-webkit-scrollbar{display:none}
.pchips button{flex:none;display:flex;gap:8px;align-items:baseline;padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.22);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pchips button i{font-style:normal;font-size:11px;font-weight:500;opacity:.6}
.pchips button.mod i{opacity:1;color:var(--ice)}
.pchips button.sel{background:linear-gradient(180deg,#fff,#e8e6df);color:#16181b;border-color:#fff;
  text-shadow:none;box-shadow:0 6px 16px rgba(0,0,0,.3),0 0 16px rgba(255,255,255,.25)}
.pchips button.sel i{color:#555;opacity:1}

.pread{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:2px 0 6px}
.pread b{font-size:38px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 10px rgba(0,0,0,.45)}
.pread small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}

.rwrap{position:relative}
.ruler{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:56px;touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.ruler::-webkit-scrollbar{display:none}
.rtrack{height:100%;
  background-image:linear-gradient(90deg,rgba(255,255,255,.95) 0 2px,transparent 2px),
                   linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px);
  background-size:90px 24px,10px 14px;
  background-position:var(--off,50%) 20px,var(--off,50%) 25px;
  background-repeat:repeat-x}
.needle{position:absolute;left:50%;top:8px;width:3px;height:44px;margin-left:-1.5px;border-radius:2px;
  background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9),0 0 0 1px rgba(0,0,0,.2);pointer-events:none}

.pnote{color:rgba(255,255,255,.55);font-size:12px;margin:6px 2px 0;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.4}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<video id="pv" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="guides"></canvas>
<canvas id="hist" width="192" height="84"></canvas>
<div id="faceBox"></div>
<div id="level"></div>
<div id="count"></div>
<div id="shot"></div>
<div id="focusRing"></div>

<div id="ui">
  <div id="top">
    <div class="grp">
      <button class="tbtn hit" id="bFlash" aria-label="Flash"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></svg></button>
      <button class="tbtn hit" id="bTimer" aria-label="Timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.4"/><path d="M10 3h4"/><path d="M12 13V8.4"/></svg><b class="lbl">Off</b></button>
      <button class="tbtn hit" id="bGrid" aria-label="Grid"><svg viewBox="0 0 24 24"><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/></svg></button>
      <button class="tbtn hit" id="bRes" aria-label="Resolution">FHD</button>
      <button class="tbtn hit" id="bFalse" aria-label="False color">FC</button>
    </div>
  </div>

  <div id="hint">Starting camera…</div>
  <div id="timer">0:00</div>

  <div id="rail">
    <button class="zoom hit" data-z="1">1×</button>
    <button class="zoom hit" data-z="2">2×</button>
    <button class="zoom hit" data-z="5">5×</button>
  </div>

  <div class="panel hit" id="pLook"></div>
  <div class="panel hit" id="pAdjust"></div>
  <div class="panel hit" id="pPro"></div>
  <div class="panel hit" id="pSmart"></div>
  <div class="panel hit" id="pAudio">
    <i class="grab"></i>
    <div class="row"><label>Mic</label><select id="micSel"></select></div>
    <div class="row"><label>Gain</label><input type="range" id="audioGain" min="0" max="2" step="0.05" value="1"><output>1.00×</output></div>
    <div class="row"><label>Burst</label><input type="range" id="burst" min="4" max="20" step="1" value="12"><output>12</output></div>
    <div class="presets">
      <button class="btn sel" id="aWnd">Wind filter</button>
      <button class="btn sel" id="aLim">Limiter</button>
    </div>
    <div class="meter" id="audioMeter"></div>
  </div>

  <div id="dock">
    <button class="chip hit" id="bLook"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>Look</button>
    <button class="chip hit" id="bAdjust"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Adjust</button>
    <button class="chip hit" id="bPro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>Pro</button>
    <button class="chip hit" id="bSmart"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="5"/><path d="M9.5 10v1.2M14.5 10v1.2M9 14.6c1.7 1.4 4.3 1.4 6 0"/></svg>Smart</button>
    <button class="chip hit" id="bAudio"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Audio</button>
  </div>

  <div id="modes" style="--i:0">
    <button class="hit sel" data-m="photo">Photo</button>
    <button class="hit" data-m="video">Video</button>
    <button class="hit" data-m="ultra">Ultra 4K</button>
    <button class="hit" data-m="night">Night</button>
  </div>

  <div id="bar">
    <button class="hit" id="thumb" aria-label="Gallery"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l4.5-4.5 3.5 3.5 3-3 5 5"/></svg></button>
    <button class="hit" id="shutter" aria-label="Shutter"><span class="core"></span><i class="rip"></i></button>
    <button class="hit" id="bFlip" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M20 7v4h-4M4 17v-4h4M6.5 9A7 7 0 0 1 19 11M17.5 15A7 7 0 0 1 5 13"/></svg></button>
  </div>

  <div id="err"><pre></pre></div>
</div>

<div id="viewer">
  <div class="vwrap"></div>
  <div class="vbar">
    <button class="btn" id="vShare">Share</button>
    <button class="btn" id="vSave">Save</button>
    <button class="btn" id="vClose">Close</button>
  </div>
</div>

<script type="module">
/* ============================================================
   CAM PRO — with working Face Lock, Face Focus, Stabilizer,
   AE/AF Lock, Level, Peaking, and full Pro / Smart panels.
   ============================================================ */
const $ = s => document.querySelector(s);
const video = $('#pv');
const glCanvas = $('#gl');
const guides = $('#guides');
const gctx = guides.getContext('2d');
const histCv = $('#hist');
const hctx = histCv.getContext('2d');
const hint = $('#hint');
const timerEl = $('#timer');
const errEl = $('#err');
const shutter = $('#shutter');
const thumb = $('#thumb');
const viewer = $('#viewer');

/* ---------- state ---------- */
const state = {
  mode: 'photo',
  facing: 'environment',
  resIdx: 1,
  timerSec: 0,
  torch: false,
  grid: false,
  falseColor: false,
  zebra: false,
  peaking: false,
  hist: false,
  zoom: 1,
  digitalZoom: 1,
  gain: 1,
  wind: true,
  limiter: true,
  burst: 12,
  micId: '',
  faceLock: false,
  faceFocus: false,
  stabilizer: false,
  lockAEAF: false,
  level: false,
  faceCenter: null,
  faceBox: null,
  stabOffset: {x:0, y:0},
  stabTarget: {x:0, y:0},
  stabPan: {x:0, y:0}
};
const G = {exposure:0, contrast:1, saturation:1, temp:0, tint:0, highlights:0, shadows:0, vignette:0};
const DEFAULT_G = {...G};
const PRESETS = {
  Natural:{},
  Cinematic:{exposure:-.15,contrast:1.18,saturation:.85,temp:-.15,tint:.05,highlights:-.25,shadows:.15,vignette:.35},
  Vivid:{contrast:1.12,saturation:1.4,highlights:-.1,shadows:.1},
  Warm:{temp:.4,tint:.05,saturation:1.1,contrast:1.05},
  Mono:{saturation:0,contrast:1.2,vignette:.25}
};
const RES = [[1280,720,'HD'],[1920,1080,'FHD'],[3840,2160,'4K']];

let camStream = null, videoTrack = null, imageCapture = null;
let recorder = null, recording = false, recStart = 0, recStream = null;
let busy = false;
let lastCap = null;
let lastHist = 0;
let lastMotion = 0;

/* ---------- WebGL grading + crop + peaking ---------- */
const FRAG = `precision highp float;
varying vec2 v;
uniform sampler2D uTex;
uniform vec4 uG1;
uniform vec4 uG2;
uniform vec4 uCrop;
uniform float uFalse, uZebra, uPeak;
uniform vec2 uTexel;

vec3 tanh3(vec3 x){
  vec3 y = clamp(x, -10.0, 10.0);
  vec3 e = exp(2.0 * y);
  return (e - 1.0) / (e + 1.0);
}
vec3 softc(vec3 x){
  vec3 o = max(x - 0.8, 0.0);
  return min(x, 0.8) + 0.2 * tanh3(o / 0.2);
}

void main(){
  vec2 uv = uCrop.xy + v * uCrop.zw;
  vec3 c = texture2D(uTex, uv).rgb;
  c *= exp2(uG1.x);
  c *= vec3(1.0 + uG1.w * .18, 1.0 - uG2.x * .12, 1.0 - uG1.w * .18);
  c = softc(max(c, 0.0));
  float l = dot(c, vec3(.2126, .7152, .0722));
  c += uG2.z * .18 * (1.0 - smoothstep(0.0, .55, l)) + uG2.y * .18 * smoothstep(.45, 1.0, l);
  c = (c - .5) * uG1.y + .5;
  l = dot(c, vec3(.2126, .7152, .0722));
  c = mix(vec3(l), c, uG1.z);
  c *= 1.0 - uG2.w * smoothstep(.35, 1.0, length(v - .5) * 1.5);

  if (uPeak > .5) {
    float gx = dot(texture2D(uTex, uv + vec2(uTexel.x * 2.0, 0.0)).rgb
                 - texture2D(uTex, uv - vec2(uTexel.x * 2.0, 0.0)).rgb, vec3(.333));
    float gy = dot(texture2D(uTex, uv + vec2(0.0, uTexel.y * 2.0)).rgb
                 - texture2D(uTex, uv - vec2(0.0, uTexel.y * 2.0)).rgb, vec3(.333));
    float edge = length(vec2(gx, gy));
    if (edge > 0.12) c = mix(c, vec3(1.0, 0.25, 0.25), 0.75);
  }

  if (uFalse > .5) {
    float fl = dot(c, vec3(.2126, .7152, .0722));
    vec3 fc;
    if (fl < .05) fc = vec3(.1, .0, .3);
    else if (fl < .15) fc = vec3(.0, .2, 1.);
    else if (fl < .3) fc = vec3(.0, .8, 1.);
    else if (fl < .45) fc = vec3(.0, 1., .0);
    else if (fl < .6) fc = vec3(.8, 1., .0);
    else if (fl < .75) fc = vec3(1., .7, .0);
    else if (fl < .9) fc = vec3(1., .2, .0);
    else fc = vec3(1., .0, .5);
    c = mix(c, fc, .7);
  }
  if (uZebra > .5 && dot(c, vec3(.2126, .7152, .0722)) > .94) {
    float stripe = step(.5, fract((gl_FragCoord.x + gl_FragCoord.y) * .03));
    c = mix(c, vec3(1.), .55 * stripe);
  }
  gl_FragColor = vec4(clamp(c, 0., 1.), 1.);
}`;

const VERT = `attribute vec2 aPos; varying vec2 v;
void main(){ v = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }`;

let gl = null, glProg = null, glTex = null, glUni = {};

function initGL() {
  gl = glCanvas.getContext('webgl', {alpha: false, preserveDrawingBuffer: true, premultipliedAlpha: false});
  if (!gl) throw new Error('WebGL not available');
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VERT); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, FRAG); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(fs));
  glProg = gl.createProgram();
  gl.attachShader(glProg, vs); gl.attachShader(glProg, fs);
  gl.linkProgram(glProg); gl.useProgram(glProg);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(glProg, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  glTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, glTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  glUni = {
    tex:    gl.getUniformLocation(glProg, 'uTex'),
    g1:     gl.getUniformLocation(glProg, 'uG1'),
    g2:     gl.getUniformLocation(glProg, 'uG2'),
    crop:   gl.getUniformLocation(glProg, 'uCrop'),
    falseC: gl.getUniformLocation(glProg, 'uFalse'),
    zebra:  gl.getUniformLocation(glProg, 'uZebra'),
    peak:   gl.getUniformLocation(glProg, 'uPeak'),
    texel:  gl.getUniformLocation(glProg, 'uTexel')
  };
}

function getViewportCrop() {
  let cx = 0.5, cy = 0.5;
  let size = 1 / Math.max(1, state.digitalZoom);

  if (state.stabilizer) {
    cx += state.stabOffset.x * size;
    cy += state.stabOffset.y * size;
  }

  if (state.faceLock && state.faceCenter) {
    const strength = 0.55;
    const dx = (state.faceCenter.x - 0.5) * strength * size;
    const dy = (state.faceCenter.y - 0.5) * strength * size;
    cx += dx;
    cy += dy;
    size = Math.min(size, 0.72);
  }

  const half = size / 2;
  cx = Math.max(half, Math.min(1 - half, cx));
  cy = Math.max(half, Math.min(1 - half, cy));

  return {x: cx - half, y: cy - half, w: size, h: size};
}

function drawGraded(src) {
  if (!gl) return;
  if (src && src.readyState !== undefined && src.readyState < 2) return;
  if (src && src.videoWidth !== undefined && (!src.videoWidth || !src.videoHeight)) return;

  const w = glCanvas.width, h = glCanvas.height;
  if (!w || !h) return;
  gl.viewport(0, 0, w, h);
  gl.useProgram(glProg);
  gl.bindTexture(gl.TEXTURE_2D, glTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.uniform1i(glUni.tex, 0);
  gl.uniform4f(glUni.g1, G.exposure, G.contrast, G.saturation, G.temp);
  gl.uniform4f(glUni.g2, G.tint, G.highlights, G.shadows, G.vignette);
  const c = getViewportCrop();
  gl.uniform4f(glUni.crop, c.x, c.y, c.w, c.h);
  gl.uniform1f(glUni.falseC, state.falseColor ? 1 : 0);
  gl.uniform1f(glUni.zebra,  state.zebra ? 1 : 0);
  gl.uniform1f(glUni.peak,   state.peaking ? 1 : 0);
  gl.uniform2f(glUni.texel, 1 / w, 1 / h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function isIdentity() {
  return !state.falseColor && !state.zebra && !state.peaking &&
    state.digitalZoom === 1 && !state.faceLock && !state.stabilizer &&
    G.exposure === 0 && G.contrast === 1 && G.saturation === 1 &&
    G.temp === 0 && G.tint === 0 && G.highlights === 0 && G.shadows === 0 && G.vignette === 0;
}

/* ---------- audio pipeline ---------- */
let audioCtx = null, audioSrc = null, hpf = null, comp = null, gainNode = null, analyser = null, dest = null;
let meterRAF = 0;

async function setupAudio() {
  try {
    if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
    const constraints = {
      audio: state.micId
        ? {deviceId: {exact: state.micId}, echoCancellation:false, noiseSuppression:false, autoGainControl:false}
        : {echoCancellation:false, noiseSuppression:false, autoGainControl:false}
    };
    const micStream = await navigator.mediaDevices.getUserMedia(constraints);
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioSrc = audioCtx.createMediaStreamSource(micStream);
    hpf = audioCtx.createBiquadFilter();
    hpf.type = 'highpass'; hpf.frequency.value = state.wind ? 90 : 20;
    comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = state.limiter ? -18 : 0;
    comp.knee.value = 6;
    comp.ratio.value = state.limiter ? 20 : 1;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = state.gain;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    dest = audioCtx.createMediaStreamDestination();

    audioSrc.connect(hpf);
    hpf.connect(comp);
    comp.connect(gainNode);
    gainNode.connect(analyser);
    gainNode.connect(dest);

    startMeter();
  } catch (e) {
    console.warn('Audio unavailable', e);
    showHint('Mic unavailable — video only');
  }
}

function startMeter() {
  const meter = $('#audioMeter');
  if (!meter) return;
  if (!meter.children.length) {
    for (let i = 0; i < 16; i++) meter.appendChild(document.createElement('i'));
  }
  if (!analyser) return;
  const data = new Uint8Array(analyser.fftSize);
  cancelAnimationFrame(meterRAF);
  (function loop() {
    analyser.getByteTimeDomainData(data);
    let peak = 0;
    for (let i = 0; i < data.length; i++) {
      const v = Math.abs(data[i] - 128) / 128;
      if (v > peak) peak = v;
    }
    const bars = meter.children;
    const lit = Math.round(peak * bars.length * 1.4);
    for (let i = 0; i < bars.length; i++) bars[i].style.height = i < lit ? '100%' : '18%';
    meterRAF = requestAnimationFrame(loop);
  })();
}

async function populateMics() {
  const sel = $('#micSel');
  if (!sel) return;
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const mics = devs.filter(d => d.kind === 'audioinput');
    sel.innerHTML = '';
    mics.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Microphone ${i + 1}`;
      sel.appendChild(opt);
    });
    state.micId = sel.value = mics[0]?.deviceId || '';
  } catch (e) {}
}

/* ---------- camera ---------- */
async function startCamera() {
  showHint('Starting camera…');
  try {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    const [rw, rh] = RES[state.resIdx];
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: state.facing}, width: {ideal: rw}, height: {ideal: rh}, frameRate: {ideal: 30}},
      audio: false
    });
    video.srcObject = camStream;
    await video.play();
    videoTrack = camStream.getVideoTracks()[0];
    try { imageCapture = new ImageCapture(videoTrack); } catch (e) { imageCapture = null; }
    resizeCanvas();
    await setupAudio();
    await populateMics();
    if (state.zoom > 1) await applyZoom(state.zoom);
    state.faceCenter = null;
    state.faceBox = null;
    state.stabOffset = {x:0, y:0};
    state.stabTarget = {x:0, y:0};
    state.stabPan = {x:0, y:0};
    state.lockAEAF = false;
    showHint('Tap the shutter, or pick a mode');
    setTimeout(() => hint.classList.remove('on'), 2200);
  } catch (e) {
    console.error(e);
    setErr('Camera failed: ' + e.message + '\n\nCheck site permissions (must be HTTPS or localhost) and that no other app is using the camera.');
  }
}

function resizeCanvas() {
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  glCanvas.width = vw;
  glCanvas.height = vh;
  guides.width = vw;
  guides.height = vh;
  drawGuides();
}

/* ---------- guides ---------- */
function drawGuides() {
  gctx.clearRect(0, 0, guides.width, guides.height);
  if (!state.grid) return;
  const w = guides.width, h = guides.height;
  gctx.strokeStyle = 'rgba(255,255,255,.35)';
  gctx.lineWidth = Math.max(1, w / 900);
  for (let i = 1; i < 3; i++) {
    gctx.beginPath(); gctx.moveTo(w * i / 3, 0); gctx.lineTo(w * i / 3, h); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(0, h * i / 3); gctx.lineTo(w, h * i / 3); gctx.stroke();
  }
  gctx.strokeStyle = 'rgba(255,255,255,.55)';
  gctx.beginPath(); gctx.moveTo(w / 2 - 12, h / 2); gctx.lineTo(w / 2 + 12, h / 2);
  gctx.moveTo(w / 2, h / 2 - 12); gctx.lineTo(w / 2, h / 2 + 12); gctx.stroke();
}

/* ---------- histogram ---------- */
function drawHistogram() {
  if (!state.hist) return;
  if (!video.videoWidth) return;
  const c = document.createElement('canvas');
  const s = 60;
  c.width = s; c.height = Math.round(s * (video.videoHeight / video.videoWidth || 9 / 16));
  const ctx = c.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(video, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  const bins = new Uint32Array(64);
  const dr = new Uint32Array(64), dg = new Uint32Array(64), db = new Uint32Array(64);
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] >> 2, g = d[i+1] >> 2, b = d[i+2] >> 2;
    const l = Math.round((d[i] * 0.2126 + d[i+1] * 0.7152 + d[i+2] * 0.0722) / 4);
    bins[l]++;
    dr[r]++; dg[g]++; db[b]++;
  }
  let max = 0;
  for (let i = 0; i < 64; i++) if (bins[i] > max) max = bins[i];
  hctx.clearRect(0, 0, histCv.width, histCv.height);
  const W = histCv.width, H = histCv.height;
  hctx.globalCompositeOperation = 'lighter';
  const drawC = (arr, color) => {
    hctx.fillStyle = color;
    for (let i = 0; i < 64; i++) {
      const h = (arr[i] / max) * (H - 4);
      hctx.fillRect((i / 64) * W, H - h, W / 64, h);
    }
  };
  drawC(dr, 'rgba(255,80,80,.45)');
  drawC(dg, 'rgba(80,255,80,.45)');
  drawC(db, 'rgba(80,80,255,.45)');
  hctx.globalCompositeOperation = 'source-over';
}

/* ---------- zoom (hardware first, digital fallback) ---------- */
async function applyZoom(z) {
  z = Math.max(1, z);
  state.zoom = z;
  let hw = 1;
  if (videoTrack) {
    try {
      const caps = videoTrack.getCapabilities?.() || {};
      if (caps.zoom && caps.zoom.max != null && caps.zoom.max > 1) {
        const v = Math.min(caps.zoom.max, z);
        let ok = false;
        try { await videoTrack.applyConstraints({advanced: [{zoom: v}]}); ok = true; }
        catch (e1) {
          try { await videoTrack.applyConstraints({zoom: v}); ok = true; } catch (e2) {}
        }
        if (ok) {
          const st = videoTrack.getSettings?.() || {};
          hw = st.zoom || v;
        }
      }
    } catch (e) {}
  }
  state.digitalZoom = Math.max(1, z / hw);
  updateZoomUI();
}

function updateZoomUI() {
  document.querySelectorAll('.zoom').forEach(b => {
    b.classList.toggle('on', Math.abs(+b.dataset.z - state.zoom) < 0.15);
  });
}

/* ---------- torch / flash ---------- */
async function toggleTorch() {
  if (!videoTrack) return;
  try {
    const caps = videoTrack.getCapabilities?.();
    if (!caps || !caps.torch) { showHint('Torch not supported'); return; }
    state.torch = !state.torch;
    await videoTrack.applyConstraints({advanced: [{torch: state.torch}]});
    $('#bFlash').classList.toggle('act', state.torch);
  } catch (e) { showHint('Torch unavailable'); }
}

/* ---------- face detection ---------- */
let faceDetector = null;
try {
  if ('FaceDetector' in window) {
    faceDetector = new window.FaceDetector({fastMode: true, maxDetectedFaces: 1});
  }
} catch (e) { faceDetector = null; }
const faceAvailable = !!faceDetector;

/* ---------- stabilizer: motion estimation ---------- */
const motionCv = document.createElement('canvas');
motionCv.width = 32; motionCv.height = 18;
const motionCtx = motionCv.getContext('2d', {willReadFrequently: true});
let prevMotionData = null;

function estimateMotion() {
  if (!video.videoWidth || video.readyState < 2) return null;
  motionCtx.drawImage(video, 0, 0, 32, 18);
  const curr = motionCtx.getImageData(0, 0, 32, 18).data;
  if (!prevMotionData) {
    prevMotionData = new Uint8ClampedArray(curr);
    return null;
  }
  let bestDx = 0, bestDy = 0, bestErr = Infinity;
  const R = 3;
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      let err = 0;
      for (let y = R; y < 18 - R; y++) {
        for (let x = R; x < 32 - R; x++) {
          const i1 = ((y + dy) * 32 + (x + dx)) * 4;
          const i2 = (y * 32 + x) * 4;
          err += Math.abs(curr[i1] - prevMotionData[i2]);
        }
      }
      if (err < bestErr) { bestErr = err; bestDx = dx; bestDy = dy; }
    }
  }
  prevMotionData = new Uint8ClampedArray(curr);
  return {dx: bestDx / 32, dy: bestDy / 18};
}

function updateStabilizer() {
  if (!state.stabilizer) return;
  const now = performance.now();
  if (now - lastMotion < 30) return;
  lastMotion = now;
  const m = estimateMotion();
  if (!m) return;

  // Slow-moving pan estimate (low-pass filter)
  state.stabPan.x = state.stabPan.x * 0.97 + m.dx * 0.03;
  state.stabPan.y = state.stabPan.y * 0.97 + m.dy * 0.03;

  // Jitter = motion minus pan
  const jx = m.dx - state.stabPan.x;
  const jy = m.dy - state.stabPan.y;

  state.stabTarget.x += jx;
  state.stabTarget.y += jy;
  state.stabTarget.x = Math.max(-0.05, Math.min(0.05, state.stabTarget.x));
  state.stabTarget.y = Math.max(-0.05, Math.min(0.05, state.stabTarget.y));
  state.stabTarget.x *= 0.98;
  state.stabTarget.y *= 0.98;

  state.stabOffset.x += (state.stabTarget.x - state.stabOffset.x) * 0.15;
  state.stabOffset.y += (state.stabTarget.y - state.stabOffset.y) * 0.15;
}

/* ---------- level indicator ---------- */
let orientData = null;
function onOrient(e) {
  orientData = e;
  updateLevelDisplay();
}
function startLevelTracking() {
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => {
      if (r === 'granted') window.addEventListener('deviceorientation', onOrient);
      else showHint('Motion access denied');
    }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientation', onOrient);
  }

function stopLevelTracking() {
  window.removeEventListener('deviceorientation', onOrient);

function updateLevelDisplay() {
  const el = $('#level');
  if (!state.level) { el.classList.remove('on'); return; }
  el.classList.add('on');
  if (!orientData) return;
  const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let roll = 0;
  if (angle === 0) roll = orientData.gamma || 0;
  else if (angle === 90) roll = -(orientData.beta || 0);
  else if (angle === 180) roll = -(orientData.gamma || 0);
  else if (angle === 270) roll = (orientData.beta || 0);
  // Normalize to -90..90
  while (roll > 90) roll -= 180;
  while (roll < -90) roll += 180;
  el.style.transform = `translate(-50%,-50%) rotate(${roll}deg)`;
  el.classList.toggle('ok', Math.abs(roll) < 2);
}

/* ---------- burst merge worker ---------- */
const MERGE_WORKER_SRC = `
function grayDown(data, w, h, f) {
  const dw = (w/f)|0, dh = (h/f)|0;
  const g = new Float32Array(dw*dh);
  for (let y=0; y<dh; y++) for (let x=0; x<dw; x++) {
    let s=0, c=0;
    for (let dy=0; dy<f; dy++) for (let dx=0; dx<f; dx++) {
      const px=x*f+dx, py=y*f+dy;
      if (px>=w || py>=h) continue;
      const i=(py*w+px)*4;
      s += data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
      c++;
    }
    g[y*dw+x] = c ? s/c : 0;
  }
  return {data:g, w:dw, h:dh};
}
function sampleGray(g,w,h,x,y){
  x=Math.max(0,Math.min(w-1.001,x)); y=Math.max(0,Math.min(h-1.001,y));
  const ix=x|0, iy=y|0, ax=x-ix, ay=y-iy, i=iy*w+ix;
  return g[i]*(1-ax)*(1-ay)+g[i+1]*ax*(1-ay)+g[i+w]*(1-ax)*ay+g[i+w+1]*ax*ay;
}
function lkAlign(ref,img,w,h,iters){
  let dx=0,dy=0;
  for(let it=0;it<iters;it++){
    let a11=0,a12=0,a22=0,b1=0,b2=0;
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const fx=x+dx, fy=y+dy;
      const p=sampleGray(img,w,h,fx,fy);
      const gx=(sampleGray(img,w,h,fx+1,fy)-sampleGray(img,w,h,fx-1,fy))*0.5;
      const gy=(sampleGray(img,w,h,fx,fy+1)-sampleGray(img,w,h,fx,fy-1))*0.5;
      const it2=p-ref[y*w+x];
      a11+=gx*gx; a12+=gx*gy; a22+=gy*gy;
      b1-=gx*it2; b2-=gy*it2;
    }
    const det=a11*a22-a12*a12;
    if(Math.abs(det)<1e-6) break;
    const ux=(a22*b1-a12*b2)/det, uy=(a11*b2-a12*b1)/det;
    dx+=ux; dy+=uy;
    if(Math.abs(ux)<0.02 && Math.abs(uy)<0.02) break;
  }
  return {dx,dy};
}
function sampleRGB(data,w,h,x,y){
  x=Math.max(0,Math.min(w-1.001,x)); y=Math.max(0,Math.min(h-1.001,y));
  const ix=x|0, iy=y|0, ax=x-ix, ay=y-iy;
  const i=(iy*w+ix)*4, j=(iy*w+ix+1)*4, k=((iy+1)*w+ix)*4, l=((iy+1)*w+ix+1)*4;
  const w00=(1-ax)*(1-ay), w10=ax*(1-ay), w01=(1-ax)*ay, w11=ax*ay;
  return [
    data[i]*w00+data[j]*w10+data[k]*w01+data[l]*w11,
    data[i+1]*w00+data[j+1]*w10+data[k+1]*w01+data[l+1]*w11,
    data[i+2]*w00+data[j+2]*w10+data[k+2]*w01+data[l+2]*w11
  ];
}
self.onmessage = (e) => {
  const {frames, width, height, scale} = e.data;
  const n = frames.length;
  const ow = width*scale, oh = height*scale;

  self.postMessage({type:'progress', phase:'align', value:0});
  const grays = frames.map(f => grayDown(f.data, width, height, 4));
  const shifts = [{dx:0,dy:0}];
  for (let i=1; i<n; i++) {
    const s = lkAlign(grays[0].data, grays[i].data, grays[0].w, grays[0].h, 10);
    shifts.push({dx:s.dx*4, dy:s.dy*4});
    self.postMessage({type:'progress', phase:'align', value:i/n});
  }

  const out = new Uint8ClampedArray(ow*oh*4);
  const TILE = 64;
  for (let y0=0; y0<oh; y0+=TILE) {
    const y1 = Math.min(oh, y0+TILE);
    const th = y1-y0;
    const accR=new Float32Array(ow*th), accG=new Float32Array(ow*th), accB=new Float32Array(ow*th), accW=new Float32Array(ow*th);
    for (let fi=0; fi<n; fi++) {
      const fd = frames[fi].data, {dx,dy} = shifts[fi];
      for (let oy=y0; oy<y1; oy++) for (let ox=0; ox<ow; ox++) {
        const sx = ox/scale - dx, sy = oy/scale - dy;
        const p = sampleRGB(fd, width, height, sx, sy);
        const ti = (oy-y0)*ow + ox;

          const diff = Math.abs(p[0]-mr)+Math.abs(p[1]-mg)+Math.abs(p[2]-mb);
          if (diff > 60) w = 0.05;
        }

    for (let oy=y0; oy<y1; oy++) for (let ox=0; ox<ow; ox++) {
      const ti=(oy-y0)*ow+ox, oi=(oy*ow+ox)*4;
      const w = accW[ti] || 1;

    }
    self.postMessage({type:'progress', phase:'merge', value:y1/oh});
  }
  self.postMessage({type:'done', data:out, width:ow, height:oh}, [out.buffer]);

`;

let mergeWorkerURL = null;
function getMergeWorker() {
  if (!mergeWorkerURL) mergeWorkerURL = URL.createObjectURL(new Blob([MERGE_WORKER_SRC], {type: 'text/javascript'}));
  return new Worker(mergeWorkerURL);
}

function captureBurst(n, maxLong, onProgress) {
  return new Promise((resolve) => {
    const frames = [];
    const vw = video.videoWidth, vh = video.videoHeight;
    const k = Math.min(1, maxLong / Math.max(vw, vh));
    const w = Math.round(vw * k), h = Math.round(vh * k);
    let i = 0;
    const grab = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      const id = ctx.getImageData(0, 0, w, h);
      frames.push({data: id.data, width: w, height: h});
      i++;
      onProgress?.(i, n);
      if (i < n) requestAnimationFrame(grab);
      else resolve(frames);
    };
    requestAnimationFrame(grab);
  });
}

function mergeFrames(frames, scale, onProgress) {
  return new Promise((resolve, reject) => {
    const w = getMergeWorker();
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'progress') onProgress?.(m);
      else if (m.type === 'done') { w.terminate(); resolve(m); }
    };
    w.onerror = (err) => { w.terminate(); reject(err); };
    const msg = frames.map(f => ({data: f.data, width: f.width, height: f.height}));
    const transfer = frames.map(f => f.data.buffer);
    w.postMessage({frames: msg, width: frames[0].width, height: frames[0].height, scale}, transfer);
  });
}

      const sub = b.querySelector('i');
      if (sub) sub.textContent = params[i].fmt(params[i].get());
      b.classList.toggle('mod', Math.abs(params[i].get() - params[i].def) > 1e-6);
    });
  }
  function seek() {
    const p = params[cur]; if (!p) return;
    lock = true; ruler.scrollLeft = frac(p) * RANGE;
    requestAnimationFrame(() => lock = false);
  }
  function rebuild() {
    params = paramsGetter();
    cur = Math.min(cur, Math.max(0, params.length - 1));
    chips.innerHTML = '';
    params.forEach((p, i) => {
      const b = document.createElement('button');
      b.innerHTML = `${p.label}<i></i>`;
      b.onclick = () => { cur = i; paint(); seek(); };
      chips.appendChild(b);
    });
    chips.style.display = params.length > 1 ? '' : 'none';
    size(); paint(); seek();
  }
  ruler.addEventListener('scroll', () => {
    if (lock) return;
    const p = params[cur]; if (!p) return;
    let v = p.min + ruler.scrollLeft / RANGE * (p.max - p.min);
    v = Math.min(p.max, Math.max(p.min, +(Math.round(v / p.step) * p.step).toFixed(6)));
    if (v === p.get()) return;
    p.set(v); paint();
    const now = performance.now();
    if (now - lastTick > 45) { lastTick = now; navigator.vibrate?.(3); }
  });
  ruler.addEventListener('dblclick', () => { const p = params[cur]; if (p) { p.set(p.def); paint(); seek(); } });
  new ResizeObserver(() => { size(); seek(); }).observe(ruler);
  rebuild();
  return {rebuild, refresh() { paint(); seek(); }};
}

const sgn = (v, d = 2) => (v > 0 ? '+' : '') + v.toFixed(d);
const GFMT = {
  exposure: v => sgn(v) + ' EV',
  contrast: v => v.toFixed(2) + '×',
  saturation: v => v.toFixed(2) + '×',
  vignette: v => Math.round(v * 100) + '%',
  temp: v => sgn(v),
  tint: v => sgn(v),
  highlights: v => sgn(v),
  shadows: v => sgn(v)
};

const ADJ_ROWS = [
  ['exposure', 'Exposure', -2, 2, .05],
  ['contrast', 'Contrast', .6, 1.5, .01],
  ['saturation', 'Saturation', 0, 2, .01],
  ['temp', 'Temperature', -1, 1, .01],
  ['tint', 'Tint', -1, 1, .01],
  ['highlights', 'Highlights', -1, 1, .01],
  ['shadows', 'Shadows', -1, 1, .01],
  ['vignette', 'Vignette', 0, 1, .01]
];

const ppAdjust = makePanel('pAdjust', () =>
  ADJ_ROWS.map(([k, label, min, max, step]) => ({
    id: k, label, min, max, step, def: DEFAULT_G[k],
    get: () => G[k], set: v => { G[k] = v; }, fmt: GFMT[k]
  }))
);

/* ---------- Pro panel ---------- */
let proList = [];
const ppPro = makePanel('pPro', () => proList);

async function buildPro() {
  proList = [];
  if (!videoTrack) { ppPro.rebuild(); return; }
  const caps = videoTrack.getCapabilities?.() || {};
  const st = videoTrack.getSettings?.() || {};

  proList.push({
    id: 'zoom', label: 'Zoom', min: 1, max: 10, step: 0.1, def: 1,
    get: () => state.zoom,
    set: v => applyZoom(v),
    fmt: v => v.toFixed(1) + '×'
  });

  const add = (key, label, fmt, extra) => {
    const c = caps[key];
    if (!c || c.max == null) return;
    let val = st[key] ?? c.min;
    const def = val;
    proList.push({id: key, label, min: c.min, max: c.max,
      step: c.step || (c.max - c.min) / 100, def,
      get: () => val, set: v => {
        val = v;
        videoTrack.applyConstraints({advanced: [{...extra, [key]: v}]}).catch(()=>{});
      }, fmt});
  };
  add('exposureCompensation', 'EV', v => sgn(v, 1));
  add('iso', 'ISO', v => Math.round(v), {exposureMode: 'manual'});
  add('exposureTime', 'Shutter', v => '1/' + Math.round(1e4 / v), {exposureMode: 'manual'});
  add('focusDistance', 'Focus', v => v.toFixed(2) + ' m', {focusMode: 'manual'});
  add('colorTemperature', 'WB', v => Math.round(v) + 'K', {whiteBalanceMode: 'manual'});

  proList.push({
    id: 'peaking', label: 'Peaking', min: 0, max: 1, step: 1, def: 0,
    get: () => state.peaking ? 1 : 0,
    set: v => { state.peaking = !!v; },
    fmt: v => v ? 'On' : 'Off'
  });
  proList.push({
    id: 'zebra', label: 'Zebra', min: 0, max: 1, step: 1, def: 0,
    get: () => state.zebra ? 1 : 0,
    set: v => { state.zebra = !!v; },
    fmt: v => v ? 'On' : 'Off'
  });
  proList.push({
    id: 'hist', label: 'Histogram', min: 0, max: 1, step: 1, def: 0,
    get: () => state.hist ? 1 : 0,
    set: v => {
      state.hist = !!v;
      histCv.classList.toggle('on', state.hist);
    },
    fmt: v => v ? 'On' : 'Off'
  });
  proList.push({
    id: 'reset', label: 'Auto', min: 0, max: 1, step: 1, def: 0,
    get: () => 0,
    set: () => {
      videoTrack.applyConstraints({advanced: [
        {exposureMode: 'continuous', focusMode: 'continuous', whiteBalanceMode: 'continuous'}
      ]}).catch(()=>{});
      buildPro();
    },
    fmt: () => 'Reset'
  });

  ppPro.rebuild();
}

/* ---------- Smart panel ---------- */
function buildSmartPanel() {
  const p = $('#pSmart');
  p.innerHTML = `
    <i class="grab"></i>
    <div class="feats">
      <button class="feat" data-k="face" ${faceAvailable ? '' : 'disabled'}>
        <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="11" r="2.4"/><path d="M8 17c.9-1.8 2.3-2.6 4-2.6s3.1.8 4 2.6"/></svg>
        <b>Face Lock</b><small>Gimbal to the face</small>
      </button>
      <button class="feat" data-k="focus" ${faceAvailable ? '' : 'disabled'}>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21"/></svg>
        <b>Face Focus</b><small>AF on face</small>
      </button>
      <button class="feat" data-k="stab">
        <svg viewBox="0 0 24 24"><path d="M3 12c2.5-6 5.5-6 9 0s6.5 6 9 0"/></svg>
        <b>Stabilizer</b><small>Software smoothing</small>
      </button>
      <button class="feat" data-k="lock">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <b>AE/AF Lock</b><small>Freeze exp + focus</small>
      </button>
      <button class="feat" data-k="level" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M6 9v6M18 9v6"/></svg>
        <b>Level</b><small>Horizon indicator</small>
      </button>
    </div>
    <p class="pnote" id="smartStat">All off. Turn on what you need.</p>
  `;
  p.querySelectorAll('.feat').forEach(btn => {
    btn.onclick = async () => {
      const k = btn.dataset.k;
      if (k === 'face') {
        state.faceLock = !state.faceLock;
        btn.classList.toggle('on', state.faceLock);
        if (state.faceLock) {
          faceLoopActive = true;
          faceLoop();
        }
      } else if (k === 'focus') {
        state.faceFocus = !state.faceFocus;
        btn.classList.toggle('on', state.faceFocus);
        if (state.faceFocus) {
          faceLoopActive = true;
          faceLoop();
          applyFaceFocus();
        }
      } else if (k === 'stab') {
        state.stabilizer = !state.stabilizer;
        btn.classList.toggle('on', state.stabilizer);
        if (!state.stabilizer) {
          state.stabOffset = {x:0, y:0};
          state.stabTarget = {x:0, y:0};
          state.stabPan = {x:0, y:0};
          prevMotionData = null;
        }
      } else if (k === 'lock') {
        const next = !state.lockAEAF;
        const ok = await setAEAF(next);
        if (!ok) { showHint('AE/AF Lock not supported on this camera'); return; }
        state.lockAEAF = next;
        btn.classList.toggle('on', state.lockAEAF);
      } else if (k === 'level') {
        state.level = !state.level;
        btn.classList.toggle('on', state.level);
        if (state.level) startLevelTracking();
        else stopLevelTracking();
      }
      updateSmartStat();
    };
  });
  updateSmartStat();
}

function updateSmartStat() {
  const parts = [];
  if (state.faceLock) parts.push('Face Lock');
  if (state.faceFocus) parts.push('Face Focus');
  if (state.stabilizer) parts.push('Stabilizer');
  if (state.lockAEAF) parts.push('AE/AF Lock');
  if (state.level) parts.push('Level');
  const el = $('#smartStat');
  if (!el) return;
  el.textContent = parts.length ? 'Active: ' + parts.join(' · ') : 'All off. Turn on what you need.';
}

/* ---------- Look panel ---------- */
function buildLookPanel() {
  const p = $('#pLook');
  p.innerHTML = '<i class="grab"></i><div class="presets" id="lookPresets"></div><p class="pnote">Tap a look to apply. Double-tap a slider in Adjust to reset it.</p>';
  const presets = $('#lookPresets');
  Object.keys(PRESETS).forEach(name => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = name;
    b.onclick = () => {
      Object.assign(G, DEFAULT_G, PRESETS[name]);
      ppAdjust.refresh();
      p.querySelectorAll('.btn').forEach(x => x.classList.toggle('sel', x === b));
      showHint(name + ' applied');
    };
    if (name === 'Natural') b.classList.add('sel');
    presets.appendChild(b);
  });
}

/* ---------- mode switching ---------- */
function setMode(m) {
  state.mode = m;
  const ui = $('#ui');
  ui.classList.remove('vid', 'ultra', 'night');
  if (m === 'video') ui.classList.add('vid');
  if (m === 'ultra') ui.classList.add('ultra');
  if (m === 'night') ui.classList.add('night');
}

document.querySelectorAll('#modes button').forEach((btn, i) => {
  btn.onclick = () => {
    document.querySelectorAll('#modes button').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    $('#modes').style.setProperty('--i', i);
    setMode(btn.dataset.m);
  };
});

/* ---------- shutter ---------- */
shutter.onclick = () => {
  if (state.mode === 'photo') takePhoto();
  else if (state.mode === 'video') recording ? stopRecording() : startRecording();
  else if (state.mode === 'ultra') captureUltra();
  else if (state.mode === 'night') captureNight();
};

/* ---------- flash / timer / grid / res / false color ---------- */
$('#bFlash').onclick = toggleTorch;

const TIMERS = [0, 3, 10];
$('#bTimer').onclick = () => {
  const i = (TIMERS.indexOf(state.timerSec) + 1) % TIMERS.length;
  state.timerSec = TIMERS[i];
  $('#bTimer').querySelector('.lbl').textContent = state.timerSec === 0 ? 'Off' : state.timerSec + 's';
  $('#bTimer').classList.toggle('act', state.timerSec > 0);
};

$('#bGrid').onclick = () => {
  state.grid = !state.grid;
  $('#bGrid').classList.toggle('act', state.grid);
  guides.classList.toggle('on', state.grid);
  drawGuides();
};

const RES_LABELS = ['HD', 'FHD', '4K'];
$('#bRes').onclick = async () => {
  state.resIdx = (state.resIdx + 1) % RES.length;
  $('#bRes').textContent = RES_LABELS[state.resIdx];
  showHint('Restarting camera at ' + RES_LABELS[state.resIdx]);
  await startCamera();
};

$('#bFalse').onclick = () => {
  state.falseColor = !state.falseColor;
  $('#bFalse').classList.toggle('act', state.falseColor);
  showHint(state.falseColor ? 'False colour on' : 'False colour off');
};

/* ---------- zoom pills ---------- */
document.querySelectorAll('.zoom').forEach(b => {
  b.onclick = () => applyZoom(+b.dataset.z);
});

/* ---------- flip camera ---------- */
$('#bFlip').onclick = async () => {
  if (recording) return showHint('Stop recording first');
  state.facing = state.facing === 'environment' ? 'user' : 'environment';
  await startCamera();
};

/* ---------- viewer / thumbnail ---------- */
thumb.onclick = () => {
  if (!lastCap) return showHint('Nothing captured yet');
  const w = viewer.querySelector('.vwrap');
  w.innerHTML = '';
  const el = document.createElement(lastCap.kind === 'image' ? 'img' : 'video');
  el.src = lastCap.url;
  if (lastCap.kind === 'video') { el.controls = true; el.playsInline = true; el.autoplay = true; }
  w.appendChild(el);
  viewer.classList.add('on');
};
$('#vClose').onclick = () => {
  viewer.classList.remove('on');
  viewer.querySelector('.vwrap').innerHTML = '';
};
$('#vSave').onclick = () => {
  if (!lastCap) return;
  const a = document.createElement('a');
  a.href = lastCap.url; a.download = lastCap.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
$('#vShare').onclick = async () => {
  if (!lastCap) return;
  try {
    const f = new File([lastCap.blob], lastCap.name, {type: lastCap.blob.type});
    if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f]});
    else showHint('Sharing not supported here');
  } catch (e) {}
};

/* ---------- panel toggles ---------- */
const PANELS = ['pLook', 'pAdjust', 'pPro', 'pSmart', 'pAudio'];
const DOCK_BTNS = ['bLook', 'bAdjust', 'bPro', 'bSmart', 'bAudio'];
function togglePanel(panelId, btnId) {
  const p = $('#' + panelId);
  const b = $('#' + btnId);
  const wasOpen = p.classList.contains('on');
  PANELS.forEach(id => $('#' + id).classList.remove('on'));
  DOCK_BTNS.forEach(id => $('#' + id).classList.remove('act'));
  if (!wasOpen) {
    p.classList.add('on');
    b.classList.add('act');
    if (panelId === 'pPro') buildPro();
  }
  state.hist = (panelId === 'pAdjust') && !wasOpen;
  histCv.classList.toggle('on', state.hist);
}
$('#bLook').onclick = () => togglePanel('pLook', 'bLook');
$('#bAdjust').onclick = () => togglePanel('pAdjust', 'bAdjust');
$('#bPro').onclick = () => togglePanel('pPro', 'bPro');
$('#bSmart').onclick = () => togglePanel('pSmart', 'bSmart');
$('#bAudio').onclick = () => togglePanel('pAudio', 'bAudio');

/* ---------- audio panel controls ---------- */
$('#audioGain').oninput = (e) => {
  state.gain = +e.target.value;
  e.target.nextElementSibling.textContent = state.gain.toFixed(2) + '×';
  if (gainNode) gainNode.gain.value = state.gain;
};
$('#burst').oninput = (e) => {
  state.burst = +e.target.value;
  e.target.nextElementSibling.textContent = state.burst;
};
$('#micSel').onchange = async (e) => {
  state.micId = e.target.value;
  await setupAudio();
};
$('#aWnd').onclick = (e) => {
  state.wind = !state.wind;
  e.currentTarget.classList.toggle('sel', state.wind);
  if (hpf) hpf.frequency.value = state.wind ? 90 : 20;
};
$('#aLim').onclick = (e) => {
  state.limiter = !state.limiter;
  e.currentTarget.classList.toggle('sel', state.limiter);
  if (comp) {
    comp.threshold.value = state.limiter ? -18 : 0;
    comp.ratio.value = state.limiter ? 20 : 1;
  }
};

/* ---------- grab handle drag-to-close ---------- */
document.querySelectorAll('.panel').forEach(p => {
  const g = p.querySelector('.grab');
  if (!g) return;
  let y0 = null;
  g.addEventListener('pointerdown', e => {
    y0 = e.clientY; g.setPointerCapture(e.pointerId); p.style.transition = 'none';
  });
  g.addEventListener('pointermove', e => {
    if (y0 != null) p.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`;
  });
  const end = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0; y0 = null;
    p.style.transition = ''; p.style.transform = '';
    if (dy > 60) {
      p.classList.remove('on');
      document.querySelectorAll('#dock .chip').forEach(c => c.classList.remove('act'));
    }
  };
  g.addEventListener('pointerup', end);
  g.addEventListener('pointercancel', end);
});

/* ---------- tap-to-focus + tap-to-close-panels ---------- */
async function focusAt(clientX, clientY) {
  if (!videoTrack) return;
  const rect = video.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width;
  const y = (clientY - rect.top)  / rect.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;

  const ring = $('#focusRing');
  ring.style.left = (x * 100) + '%';
  ring.style.top  = (y * 100) + '%';
  ring.classList.remove('show'); void ring.offsetWidth; ring.classList.add('show');

  try {
    await videoTrack.applyConstraints({advanced: [
      {pointsOfInterest: [{x, y}], focusMode: 'single-shot'}
    ]});
  } catch (e) {}

  if (!state.lockAEAF) {
    setTimeout(() => {
      videoTrack.applyConstraints({advanced: [{focusMode: 'continuous'}]}).catch(() => {});
    }, 1800);
  }
}
document.addEventListener('pointerdown', (e) => {
  if (e.target === video || e.target === glCanvas) {
    PANELS.forEach(id => $('#' + id).classList.remove('on'));
    DOCK_BTNS.forEach(id => $('#' + id).classList.remove('act'));
    histCv.classList.remove('on');
    state.hist = false;
    focusAt(e.clientX, e.clientY);
  }
}, {passive: true});

/* ---------- render loop ---------- */
function loop() {
  const vw = video.videoWidth, vh = video.videoHeight;

  if (vw && vh && video.readyState >= 2) {
    if (glCanvas.width !== vw || glCanvas.height !== vh) resizeCanvas();

    updateStabilizer();

    const needsGrade = !isIdentity() || recording;
    if (needsGrade) {
      video.style.display = 'none';
      glCanvas.style.display = 'block';
      drawGraded(video);
    } else {
      video.style.display = 'block';
      glCanvas.style.display = 'none';
    }

    const mir = state.facing === 'user' ? 'scaleX(-1)' : '';
    video.style.transform = mir;
    glCanvas.style.transform = mir;

    updateFaceBox();
    updateLevelDisplay();

    if (state.faceFocus && state.faceCenter && performance.now() - lastHist > 800) {
      lastHist = performance.now();
      applyFaceFocus();
    }
  }

  if (state.hist && performance.now() - lastHist > 250) {
    lastHist = performance.now();
    try { drawHistogram(); } catch (e) {}
  }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
(async function boot() {
  try {
    initGL();
    buildLookPanel();
    buildSmartPanel();
    await startCamera();
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    setErr(e.message + '\n\n' + (e.stack || ''));
  }
})();
</script>
