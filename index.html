<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hazen</title>
<style>
:root{
  --ink:#fff;--dim:rgba(255,255,255,.66);--rec:#ff453a;--ice:#5ab4ff;--vio:#9a6bff;
  --out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.5,.64,1);--soft:cubic-bezier(.65,0,.35,1);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- content layer: the camera ---------- */
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000;transition:height .5s var(--out)}
#pv,#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gl{display:none}
#scrimT,#scrimB{position:absolute;left:0;right:0;pointer-events:none;z-index:2}      /* dimming layer so glass stays legible */
#scrimT{top:0;height:150px;background:linear-gradient(rgba(0,0,0,.38),transparent)}
#scrimB{bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.5))}
#grid{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s var(--out)}
#grid.on{opacity:1}
#grid i{position:absolute;background:rgba(255,255,255,.4)}
#grid i:nth-child(1),#grid i:nth-child(2){top:0;bottom:0;width:1px}#grid i:nth-child(3),#grid i:nth-child(4){left:0;right:0;height:1px}
#grid i:nth-child(1){left:33.33%}#grid i:nth-child(2){left:66.66%}#grid i:nth-child(3){top:33.33%}#grid i:nth-child(4){top:66.66%}
#level{position:absolute;left:50%;top:50%;width:200px;height:2px;margin:-1px 0 0 -100px;border-radius:1px;background:rgba(255,255,255,.75);opacity:0;pointer-events:none;transition:opacity .25s,background .25s,box-shadow .25s}
#level.on{opacity:1}#level.ok{background:#3ddc84;box-shadow:0 0 12px rgba(61,220,132,.8)}
#fbox{position:absolute;border:2px solid #fff;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .25s,border-color .3s,left .12s linear,top .12s linear,width .12s linear,height .12s linear}
#fbox.on{opacity:1}#fbox.lock{border-color:var(--ice);box-shadow:0 0 18px rgba(90,180,255,.55)}
#ring{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:1.5px solid #fff;border-radius:22px;opacity:0;pointer-events:none;box-shadow:0 0 16px rgba(255,255,255,.45)}
#ring.go{animation:ring .9s both}
@keyframes ring{0%{opacity:0;transform:scale(1.5);animation-timing-function:var(--out)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.94)}}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:130px;font-weight:600;pointer-events:none;opacity:0;text-shadow:0 2px 20px #0008;z-index:7}
#count.pop{animation:pop 1s both}
@keyframes pop{0%{opacity:0;transform:scale(1.5);animation-timing-function:var(--out)}22%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:flash .32s var(--out)}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}

/* ---------- functional layer: Liquid Glass ---------- */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.06) 38%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.13)),rgba(255,255,255,.035);
  -webkit-backdrop-filter:blur(var(--blur,16px)) saturate(1.9) brightness(1.07);backdrop-filter:blur(var(--blur,16px)) saturate(1.9) brightness(1.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -12px 20px rgba(255,255,255,.04),0 8px var(--depth,24px) rgba(0,0,0,.26)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.7),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.32));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass>*{position:relative;z-index:1}
.int{transition:transform .5s var(--spring);touch-action:manipulation}               /* interactive: squish + specular hotspot */
.int:active{transform:scale(.93);transition-duration:.12s}
.int::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s var(--out);
  background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.4),transparent 62%)}
.int:active::before{opacity:1}
.cap{border-radius:999px}
.flat{background:rgba(255,255,255,.14)}                                                /* inside glass: flat fills only, never glass on glass */
.sel-pill{background:#fff;color:#111}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .hit{pointer-events:auto}

/* top: two clusters */
#top{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.cluster{display:flex;align-items:center;gap:2px;padding:3px;height:46px}
.cluster button{height:40px;min-width:40px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;
  transition:background .3s var(--out),color .3s var(--out),transform .5s var(--spring)}
.cluster button:active{transform:scale(.9)}
.cluster button.on{background:#fff;color:#111}
.cluster button .t{font-size:11px;letter-spacing:.02em}

/* settings: one glass object that morphs from button to sheet */
#settings{position:absolute;top:0;right:0;width:46px;height:46px;border-radius:23px;overflow:hidden;pointer-events:auto;--depth:24px;
  transition:width .62s var(--spring),height .62s var(--spring),border-radius .62s var(--spring),box-shadow .5s,-webkit-backdrop-filter .5s,backdrop-filter .5s}
#settings.open{width:min(calc(100vw - 24px),430px);border-radius:34px;--blur:30px;--depth:60px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.12),0 24px 70px rgba(0,0,0,.5)}
#gear{position:absolute;top:3px;right:3px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;z-index:3;transition:transform .6s var(--spring)}
#gear .x{position:absolute;opacity:0;transition:opacity .25s}#gear .g{transition:opacity .25s}
#settings.open #gear{transform:rotate(90deg)}#settings.open #gear .x{opacity:1}#settings.open #gear .g{opacity:0}
#sheet{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding:8px 12px 14px;opacity:0;pointer-events:none;transition:opacity .22s var(--out)}
#settings.open #sheet{opacity:1;pointer-events:auto;transition:opacity .3s var(--out) .14s}
.tabs{--i:0;position:relative;display:grid;grid-template-columns:repeat(6,1fr);width:calc(100% - 52px);height:38px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);margin-bottom:12px}
.tabs::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/6);border-radius:999px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);
  transform:translateX(calc(var(--i)*100%));transition:transform .55s var(--spring)}
.tabs button{position:relative;font-size:12px;font-weight:600;color:var(--dim);transition:color .3s;border-radius:999px}
.tabs button.on{color:#111}
.page{display:none}.page.on{display:block}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:14px 4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline;transition:background .3s,color .3s,transform .5s var(--spring)}
.chip i{font-style:normal;font-size:11px;font-weight:500;opacity:.6}.chip.mod i{opacity:1;color:var(--ice)}
.chip.on{background:#fff;color:#111}.chip.on i{color:#555;opacity:1}
.chip:active{transform:scale(.94)}
.looks{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 12px;scroll-snap-type:x proximity}
.looks::-webkit-scrollbar{display:none}
.look{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--dim);scroll-snap-align:center;transition:transform .5s var(--spring),color .3s}
.look .dot{width:56px;height:56px;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:box-shadow .3s}
.look.on{color:#fff;transform:translateY(-3px)}.look.on .dot{box-shadow:0 0 0 2.5px #fff,0 8px 18px rgba(0,0,0,.4)}
.look:active{transform:scale(.94)}
.read{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:2px 0 4px}
.read b{font-size:36px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.read small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.rw{position:relative}
.ruler{overflow:hidden;height:52px;touch-action:none;cursor:ew-resize;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.ruler::-webkit-scrollbar{display:none}
.rt{will-change:transform;height:100%;background-image:linear-gradient(90deg,rgba(255,255,255,.95) 0 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px);
  background-size:90px 22px,10px 12px;background-position:var(--off,50%) 18px,var(--off,50%) 23px;background-repeat:repeat-x}
.needle{position:absolute;left:50%;top:6px;width:3px;height:40px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9);pointer-events:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;margin:6px 0}
.row .tx{flex:1;min-width:0}.row b{display:block;font-size:14px;font-weight:600}.row small{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;transition:background .35s var(--out)}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .5s var(--spring)}
.row.on .sw{background:var(--ice)}.row.on .sw::after{transform:translateX(20px)}
.row:active .sw::after{width:30px}.row.on:active .sw::after{transform:translateX(16px)}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);margin:6px 0;position:relative}
.seg button{flex:1;height:32px;border-radius:999px;font-size:12px;font-weight:600;color:var(--dim);transition:background .3s,color .3s}
.seg button.on{background:#fff;color:#111}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:background .3s,color .3s,transform .5s var(--spring)}
.btn:active{transform:scale(.94)}.btn.on{background:#fff;color:#111}
select{width:100%;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:14px;padding:11px 12px;font-size:14px;outline:none}
select option{background:#222}
.meter{display:flex;gap:2px;height:22px;align-items:flex-end;margin:8px 2px}
.meter i{flex:1;height:18%;border-radius:2px;background:linear-gradient(to top,#3ddc84,#ffd60a 70%,#ff453a);opacity:.9;transition:height .06s linear}
.note{font-size:12px;color:var(--dim);margin:6px 4px;line-height:1.4}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16);color:var(--dim)}
.badge.ok{background:rgba(61,220,132,.25);color:#7dffb0}.badge.bad{background:rgba(255,69,58,.25);color:#ff9d96}

/* chips under the top bar */
#pills{position:absolute;top:calc(64px + var(--safe-t));left:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#hist{width:96px;height:44px;border-radius:16px;display:none}#hist.on{display:block}
#hint{position:fixed;z-index:50;top:calc(64px + var(--safe-t));left:50%;transform:translate(-50%,-8px) scale(.96);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;max-width:86%;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;visibility:hidden;transition:transform .5s var(--spring),visibility 0s .3s}
#hint.on{transform:translate(-50%,0) scale(1);visibility:visible;transition:transform .5s var(--spring),visibility 0s}
#hint.act{pointer-events:auto}
#timer{position:absolute;top:calc(64px + var(--safe-t));left:50%;transform:translate(-50%,-8px);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:linear-gradient(#ff7b70,#e0372d);box-shadow:0 6px 16px rgba(224,55,45,.45);display:none}
#timer.on{display:block;transform:translate(-50%,0)}

/* bottom: zoom + modes in glass containers, shutter row */
#bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(14px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:12px}
#zoom{--i:0;display:flex;padding:3px;height:42px;position:relative}
#zoom::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:40px;border-radius:999px;background:#fff;transform:translateX(calc(var(--i)*40px));transition:transform .55s var(--spring)}
#zoom button{position:relative;width:40px;font-size:12px;font-weight:700;border-radius:999px;color:#fff;transition:color .3s}
#zoom button.on{color:#111}
#modes{--i:0;display:flex;padding:3px;height:40px;position:relative}
#modes::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:68px;border-radius:999px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translateX(calc(var(--i)*68px));transition:transform .6s var(--spring)}
#modes button{position:relative;width:68px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);transition:color .3s}
#modes button.on{color:#111}
#bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.rnd{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background-size:cover;background-position:center}
#thumb.has svg{display:none}#thumb.has{box-shadow:0 0 0 2px #fff,0 8px 20px rgba(0,0,0,.4)}
#shutter{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;--pp:0;--c:#fff}
@property --pp{syntax:'<number>';inherits:false;initial-value:0}
#shutter::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--pp)*1%),rgba(255,255,255,.65) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transition:--pp .4s linear}
#shutter.rec::before{--c:var(--rec)}
#shutter .core{width:70px;height:70px;border-radius:50%;background:radial-gradient(120% 120% at 32% 18%,#fff,#f1f0eb 45%,#c9c7be);
  box-shadow:0 4px 14px rgba(0,0,0,.4),0 1px 0 #fff inset,0 -3px 6px rgba(0,0,0,.12) inset;
  transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring),background .45s var(--out),transform .2s}
#shutter:active .core{transform:scale(.9)}
.vid #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#ffa69d,#ff453a 45%,#b91d15)}
.ultra #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#b6dcff,#5ab4ff 45%,#2f86e6)}
.night #shutter .core{background:radial-gradient(120% 120% at 32% 18%,#d9bfff,#9a6bff 45%,#5a2fc9)}
#shutter.rec .core{width:34px;height:34px;border-radius:11px;animation:breathe 1.8s ease-in-out infinite}
#shutter.work .core{animation:breathe 1s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
#shutter .rip{position:absolute;inset:8px;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none}
#shutter.snap .rip{animation:rip .6s var(--out)}
@keyframes rip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.55)}}

#viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + var(--safe-t)) 16px calc(20px + var(--safe-b));
  background:rgba(4,5,7,.7);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);opacity:0;visibility:hidden;transition:opacity .3s var(--out),visibility 0s .3s}
#viewer.on{opacity:1;visibility:visible;transition:opacity .3s var(--out),visibility 0s}
#viewer .vw{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#viewer .vw img,#viewer .vw video{max-width:100%;max-height:100%;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#viewer .btns{margin:0}
#err{position:fixed;left:12px;right:12px;top:calc(70px + var(--safe-t));z-index:30;padding:14px;border-radius:24px;display:none;pointer-events:auto;user-select:text;-webkit-user-select:text;max-height:50vh;overflow:auto}
#err.on{display:block}#err pre{margin:0 0 10px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}

/* accessibility: the system adapts the material; we adapt our own motion */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.glass{background:rgba(32,34,40,.94);-webkit-backdrop-filter:none;backdrop-filter:none}#scrimT,#scrimB{display:none}}
@media (prefers-contrast:more){.glass{background:rgba(20,22,26,.96)}.glass::after{background:#fff;padding:1.5px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(32,34,40,.88)}}

/* ---- lens-ring zoom ---- */
#lens{position:relative;width:66px;height:42px;border-radius:21px;overflow:hidden;touch-action:none;transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring),box-shadow .5s,-webkit-backdrop-filter .5s,backdrop-filter .5s}
#lens.open{width:min(90vw,350px);height:92px;border-radius:46px;--blur:26px;--depth:50px}
#lens .lv{position:absolute;left:0;right:0;top:0;height:42px;display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;z-index:3;pointer-events:none;transition:transform .5s var(--spring),height .4s var(--spring),color .3s,font-size .3s}
#lens.open .lv{height:26px;font-size:12px;color:#ffd60a;transform:translateY(3px)}
#lens .lring{position:absolute;left:14px;right:14px;top:32px;height:52px;opacity:0;border-radius:26px;overflow:hidden;transition:opacity .2s;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
#lens.open .lring{opacity:1;transition:opacity .3s .1s}
#lens .ltrack{position:absolute;top:0;bottom:0;left:0;will-change:transform;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 1.5px,transparent 1.5px 8px) 0 30px/100% 16px no-repeat,repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 4px) 0 39px/100% 10px no-repeat}
#lens .lring::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.22),transparent 32%,transparent 66%,rgba(0,0,0,.35));pointer-events:none}
.ltrack .lab{position:absolute;top:3px;transform:translateX(-50%);font-size:12px;font-weight:700;font-style:normal;color:#fff;text-shadow:0 1px 3px #000}
.ltrack .lab::after{content:"";position:absolute;left:50%;top:19px;width:2px;height:14px;margin-left:-1px;background:#fff;border-radius:1px}
#lens .lmark{position:absolute;left:50%;top:2px;width:2px;height:48px;margin-left:-1px;border-radius:1px;background:#ff453a;box-shadow:0 0 10px #ff453a;z-index:2}

/* ---- album, viewer, modal ---- */
.full{position:fixed;inset:0;z-index:20;background:#0c0d10;display:flex;flex-direction:column;padding-top:var(--safe-t);transform:translateY(103%);transition:transform .6s var(--spring)}
.full.on{transform:none}#view{z-index:22}
